name: Update SideStore source

# When a release is published (a draft from buildapp.yml being made public),
# add its IPA to sidestore-source.json on main so SideStore offers the update.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add to the source"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release IPA
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir ipa
          ls -la ipa

      - name: Add release to source
        run: |
          published=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt' | cut -c1-10)
          python3 scripts/update_sidestore_source.py sidestore-source.json ipa/*.ipa "$TAG" "$published"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Add $TAG to SideStore source"
          git push
